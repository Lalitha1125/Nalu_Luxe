
# ==========================================
# NALU LUXE - BACKEND
# Java 21 / Spring Boot 4 / MySQL 8.4
# ==========================================

spring.application.name=nalu-luxe

# SERVIDOR
server.port=8080

# BASE DE DATOS MYSQL
spring.datasource.url=jdbc:mysql://127.0.0.1:4200/nalu_luxe?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=SERVER
spring.datasource.username=${DB_USER:nalu_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# FLYWAY
spring.flyway.enabled=false

# ERRORES
server.error.include-message=always
server.error.include-stacktrace=never

# ARCHIVOS
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


# =====================================
# NALU LUXE - VERIFICACION POR CORREO
# =====================================

# Pruebas locales: OTP visible en terminal Java
nalu.mail.enabled=${MAIL_ENABLED:false}
nalu.mail.dev-console=${MAIL_DEV_CONSOLE:false}
nalu.mail.from=${MAIL_FROM:}

# SMTP real
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Evitar bloqueos indefinidos
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Diagnóstico temporal de seguridad
logging.level.org.springframework.security=DEBUG
logging.level.com.naluluxe=DEBUG